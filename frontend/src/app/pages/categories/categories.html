<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
    <h1 class="mb-0">Мої категорії</h1>

    <button
      type="button"
      class="btn btn-primary d-flex align-items-center gap-2"
      [class.disabled]="isAuthenticated() !== true"
      (click)="openSidebarForCreating()"
    >
      <span class="fw-bold fs-4 lh-1">+</span>
      <span>Додати категорію</span>
    </button>
  </div>

  <div class="d-grid gap-3">
    @for (category of categories(); track category.id) {
      <div
        class="card shadow-sm"
        role="button"
        tabindex="0"
        [class.selected]="category.id === selectedId()"
        (click)="onSelected(category.id)"
      >
        <div class="card-body d-flex align-items-center justify-content-between">
          <span class="fs-5 fw-medium text-break">
            {{ category.name }}
          </span>
        </div>
      </div>
    } @empty {
      <div class="alert alert-info">
        У вас поки немає категорій.
      </div>
    }
  </div>
</div>
