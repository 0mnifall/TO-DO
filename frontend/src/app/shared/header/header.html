<header class="navbar navbar-expand-md bg-white border-bottom shadow-sm">
  <div class="container">
    <a
      class="navbar-brand d-flex align-items-center gap-2 fw-bold"
      routerLink="/tasks"
    >
      <span class="brand-icon">✓</span>
      <span class="brand-text">TO-DO notebook</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Відкрити навігацію"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <nav
      id="mainNavbar"
      class="collapse navbar-collapse"
    >
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/tasks"
            routerLinkActive="active"
          >
            Завдання
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/categories"
            routerLinkActive="active"
          >
            Категорії
          </a>
        </li>

        @if (userName()) {
          <li class="nav-item ms-lg-2">
            <span class="nav-link username">
              {{ userName() }}
            </span>
          </li>

          <li class="nav-item ms-lg-2">
            <button
              type="button"
              class="btn btn-outline-primary x-3"
              (click)="logout.emit()"
            >
              Вийти
            </button>
          </li>
        } @else {
          <li class="nav-item ms-lg-2">
            <button
              type="button"
              class="btn btn-primary px-3"
              (click)="login.emit()"
            >
              Увійти
            </button>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
