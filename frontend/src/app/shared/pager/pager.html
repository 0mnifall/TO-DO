<nav aria-label="Task pages">
  <ul class="pagination justify-content-center">
    <li class="page-item">
      <button class="page-link" type="button" [class.disabled]="currentPage() == 1" (click)="pageChanged.emit(currentPage() - 1)">
        &laquo;
      </button>
    </li>

    @for (page of visiblePages(); track $index) {
        @if (page === '...') {
        <li class="page-item disabled">
            <span class="page-link">...</span>
        </li>
        } @else {
        <li
            class="page-item"
            [class.active]="currentPage() === page"
        >
            <button
            type="button"
            class="page-link"
            (click)="pageChanged.emit(page)"
            >
            {{ page }}
            </button>
        </li>
        }
    }

    <li class="page-item">
      <button class="page-link" type="button" [class.disabled]="currentPage() == totalPages()" (click)="pageChanged.emit(currentPage() + 1)">
        &raquo;
      </button>
    </li>
  </ul>
</nav>
